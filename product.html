<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Page</title>

<style>
body{
 margin:0;
 font-family:"Segoe UI", Arial, sans-serif;
 background:linear-gradient(to bottom,#f8f8f8,#eeeeee);
 color:#1e1e1e;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:60px 20px;
}

.product-wrapper{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:60px;
 align-items:start;
}

.product-info{
 background:white;
 padding:50px;
 border-radius:20px;
 box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

.product-info h1{
 margin:0 0 25px 0;
 font-size:36px;
 font-weight:700;
}

.price{
 font-size:28px;
 font-weight:700;
 color:#00b7c2;
 margin-bottom:10px;
}

.stock-status{
 display:inline-block;
 padding:6px 14px;
 border-radius:20px;
 font-size:13px;
 font-weight:600;
 margin-bottom:25px;
}

.in-stock{
 background:#e6f7f6;
 color:#00b7c2;
}

.out-stock{
 background:#fdeaea;
 color:#d62828;
}

.divider{
 height:1px;
 background:#e5e5e5;
 margin:25px 0;
}

.spec-item{
 margin-bottom:12px;
 font-size:15px;
 color:#555;
}

.variant-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:20px;
 margin-top:20px;
}

.variant-card{
 background:#f9f9f9;
 padding:20px;
 border-radius:16px;
 text-align:center;
 border:2px solid transparent;
}

.product-gallery{
 display:flex;
}

.main-image{
 flex:1;
 border-radius:20px;
 overflow:hidden;
 box-shadow:0 20px 50px rgba(0,0,0,0.1);
 background:white;
}

.main-image img{
 width:100%;
 display:block;
}

@media(max-width:900px){
 .product-wrapper{
  grid-template-columns:1fr;
 }
}
</style>
</head>

<body>

<div class="container">
<div class="product-wrapper">

<div class="product-info">
  <h1 id="productName">Loading...</h1>
  <div class="price" id="productPrice"></div>
  <div id="productStock"></div>

  <div class="divider"></div>

  <div id="productSpecs"></div>

  <div class="divider"></div>

  <div id="variantSection">
    <h3>Available Variants</h3>
    <div class="variant-grid" id="variantGrid"></div>
  </div>
</div>

<div class="product-gallery">
  <div class="main-image">
    <img id="productImage">
  </div>
</div>

</div>
</div>

<script>

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

/* ✅ روابط الشيت */
const productsURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSsp818LHJ9i4fVzl2B63EHr-wJwcANhC9ZSUGKQn3TqgAxOjQFe4NfLNK1-sQ7NdIisZEzOpesx2L/pub?gid=0&single=true&output=csv";

const variantsURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSsp818LHJ9i4fVzl2B63EHr-wJwcANhC9ZSUGKQn3TqgAxOjQFe4NfLNK1-sQ7NdIisZEzOpesx2L/pub?gid=365796544&single=true&output=csv";


function parseCSV(text){
 const rows=text.trim().split("\n");
 const headers=rows[0].split(",").map(h=>h.replace(/"/g,"").trim());
 return rows.slice(1).map(row=>{
  const cols=row.split(",");
  let obj={};
  headers.forEach((h,i)=>{
   obj[h]=(cols[i]||"").replace(/"/g,"").trim();
  });
  return obj;
 });
}


Promise.all([
 fetch(productsURL).then(r=>r.text()),
 fetch(variantsURL).then(r=>r.text())
]).then(([productsText,variantsText])=>{

 const products=parseCSV(productsText);
 const variants=parseCSV(variantsText);

 const product=products.find(p=>p.ProductID==productId);
 const relatedVariants=variants.filter(v=>v.ProductID==productId);

 if(!product){
  document.body.innerHTML="<h2 style='text-align:center;margin-top:100px'>Product Not Found</h2>";
  return;
 }

 document.getElementById("productName").innerText=product.Name;
 document.getElementById("productImage").src=product.Image;
 document.getElementById("productSpecs").innerHTML=`
   <div class="spec-item"><b>Category:</b> ${product.Category}</div>
   <div class="spec-item"><b>Color:</b> ${product.Color}</div>
 `;

 const variantGrid=document.getElementById("variantGrid");
 variantGrid.innerHTML="";

 let anyInStock=false;

 relatedVariants.forEach(v=>{
   if(v.Stock==="In Stock") anyInStock=true;

   variantGrid.innerHTML+=`
     <div class="variant-card">
       <b>${v.Watt}</b><br>
       ${v.Price} EGP<br>
       ${v.Dimension}<br>
       <span class="stock-status ${v.Stock==="In Stock"?"in-stock":"out-stock"}">
         ${v.Stock}
       </span>
     </div>
   `;
 });

 document.getElementById("productPrice").innerText=
   relatedVariants.length? relatedVariants[0].Price+" EGP":"";

 document.getElementById("productStock").innerHTML=
   `<div class="stock-status ${anyInStock?"in-stock":"out-stock"}">
     ${anyInStock?"In Stock":"Out of Stock"}
    </div>`;

});

</script>

</body>
</html>
