<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Page</title>

<style>

body{
 margin:0;
 font-family: Arial, sans-serif;
 background:#f6f6f6;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:40px 20px;
}

/* ✅ التخطيط الأساسي */
.product-wrapper{
 display:grid;
 grid-template-columns: 1fr 1fr;
 gap:40px;
 align-items:start;
}

/* ✅ المعلومات شمال */
.product-info{
 background:white;
 padding:30px;
 border-radius:14px;
 box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.product-info h1{
 margin:0 0 15px 0;
 font-size:28px;
}

.price{
 font-size:22px;
 font-weight:bold;
 color:#00b7c2;
 margin-bottom:20px;
}

.specs{
 margin-bottom:20px;
}

.specs div{
 margin-bottom:8px;
 color:#555;
}

.description{
 margin-top:15px;
 line-height:1.6;
 color:#444;
}

/* ✅ الصورة يمين */
.product-gallery{
 display:flex;
 flex-direction:column;
 gap:15px;
}

.main-image{
 background:white;
 border-radius:14px;
 overflow:hidden;
 box-shadow:0 10px 25px rgba(0,0,0,0.05);
}

.main-image img{
 width:100%;
 display:block;
}

.thumbnail-list{
 display:flex;
 gap:10px;
}

.thumbnail-list img{
 width:80px;
 border-radius:10px;
 cursor:pointer;
 opacity:0.7;
 transition:0.3s;
}

.thumbnail-list img:hover{
 opacity:1;
}

/* ✅ الموديلات */
.variant-section{
 margin-top:30px;
}

.variant-grid{
 display:grid;
 grid-template-columns: repeat(auto-fit,minmax(140px,1fr));
 gap:15px;
}

.variant-card{
 background:white;
 padding:15px;
 border-radius:12px;
 box-shadow:0 5px 15px rgba(0,0,0,0.05);
 cursor:pointer;
 transition:0.2s;
 text-align:center;
}

.variant-card:hover{
 transform:translateY(-3px);
 box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

/* ✅ زرار واتساب */
.whatsapp-btn{
 margin-top:30px;
 display:inline-block;
 padding:12px 25px;
 background:#25D366;
 color:white;
 border-radius:30px;
 text-decoration:none;
 font-weight:bold;
}

/* ✅ مهم جدًا – الموبايل */
@media(max-width:900px){

 .product-wrapper{
  grid-template-columns:1fr;
 }

 .thumbnail-list{
  overflow-x:auto;
 }

}

</style>
</head>

<body>

<div class="container">

<div class="product-wrapper">

<!-- ✅ المعلومات شمال -->
<div class="product-info">

 <h1>Track Spot Light</h1>

 <div class="price">900 EGP</div>

 <div class="specs">
  <div><b>Watt:</b> 20W</div>
  <div><b>Dimensions:</b> L220*W22*H82</div>
  <div><b>Color:</b> BK – 4 IN 1</div>
 </div>

 <div class="description">
  This is a clean product description area. 
  You can write Arabic or English here and it will be spaced properly.
 </div>

 <div class="variant-section">

  <h3>Available Variants</h3>

  <div class="variant-grid">

   <div class="variant-card">
    <b>20W</b><br>
    900 EGP
   </div>

   <div class="variant-card">
    <b>30W</b><br>
    1100 EGP
   </div>

  </div>

 </div>

 <a href="#" class="whatsapp-btn">Chat on WhatsApp</a>

</div>

<!-- ✅ الصورة يمين -->
<div class="product-gallery">

 <div class="main-image">
  <img src="https://via.placeholder.com/600x500">
 </div>

 <div class="thumbnail-list">
  <img src="https://via.placeholder.com/100">
  <img src="https://via.placeholder.com/100">
  <img src="https://via.placeholder.com/100">
 </div>

</div>

</div>

</div>

</body>
</html>
