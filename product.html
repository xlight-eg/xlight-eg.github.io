<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Page</title>

<style>

body{
 margin:0;
 font-family:"Segoe UI", Arial, sans-serif;
 background:linear-gradient(to bottom,#f8f8f8,#eeeeee);
 color:#1e1e1e;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:60px 20px;
}

/* Layout */
.product-wrapper{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:60px;
 align-items:start;
}

/* Info Section */
.product-info{
 background:white;
 padding:50px;
 border-radius:20px;
 box-shadow:0 20px 50px rgba(0,0,0,0.08);
}

.product-info h1{
 margin:0 0 25px 0;
 font-size:36px;
 font-weight:700;
}

.price{
 font-size:28px;
 font-weight:700;
 color:#00b7c2;
 margin-bottom:10px;
}

/* Stock */
.stock-status{
 display:inline-block;
 padding:6px 14px;
 border-radius:20px;
 font-size:13px;
 font-weight:600;
}

.in-stock{
 background:#e6f7f6;
 color:#00b7c2;
}

.out-stock{
 background:#fdeaea;
 color:#d62828;
}

.divider{
 height:1px;
 background:#e5e5e5;
 margin:25px 0;
}

/* Specs */
.spec-item{
 display:flex;
 align-items:center;
 gap:10px;
 margin-bottom:14px;
 font-size:15px;
 color:#555;
}

.spec-item i{
 color:#00b7c2;
}

/* Description */
.description{
 margin-top:20px;
 line-height:1.8;
 color:#444;
 font-size:15px;
}

/* Variants */
.variant-section{
 margin-top:35px;
}

.variant-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
 gap:20px;
 margin-top:20px;
}

.variant-card{
 background:#f9f9f9;
 padding:20px;
 border-radius:16px;
 text-align:center;
 transition:0.3s;
 cursor:pointer;
 border:2px solid transparent;
}

.variant-card:hover{
 background:white;
 transform:translateY(-5px);
 box-shadow:0 10px 30px rgba(0,0,0,0.1);
 border-color:#00b7c2;
}

/* WhatsApp */
.whatsapp-btn{
 margin-top:40px;
 display:inline-block;
 padding:14px 30px;
 background:#25D366;
 color:white;
 border-radius:40px;
 text-decoration:none;
 font-weight:600;
 transition:0.3s;
}

.whatsapp-btn:hover{
 transform:translateY(-2px);
 box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

/* Gallery */
.product-gallery{
 display:flex;
 gap:20px;
}

.main-image{
 flex:1;
 border-radius:20px;
 overflow:hidden;
 box-shadow:0 20px 50px rgba(0,0,0,0.1);
 background:white;
}

.main-image img{
 width:100%;
 display:block;
}

.thumbnail-list{
 display:flex;
 flex-direction:column;
 gap:15px;
}

.thumbnail-list img{
 width:90px;
 border-radius:12px;
 cursor:pointer;
 opacity:0.7;
 transition:0.3s;
}

.thumbnail-list img:hover{
 opacity:1;
 transform:scale(1.05);
}

/* Responsive */
@media(max-width:900px){

 .product-wrapper{
  grid-template-columns:1fr;
 }

 .product-info{
  padding:30px;
 }

 .product-gallery{
  flex-direction:column;
 }

 .thumbnail-list{
  flex-direction:row;
  overflow-x:auto;
 }

}

</style>
</head>

<body>

<div class="container">

<div class="product-wrapper">

<!-- ✅ Info Section -->
<div class="product-info">

 <h1 id="productName"></h1>
<div class="price" id="productPrice"></div>
<div id="productStock"></div>

 <div class="divider"></div>

 <div id="productSpecs"></div>

 <div class="divider"></div>

 <div class="description" id="productDescription"></div>

 <div class="variant-section" id="variantSection">
  <h3>Available Variants</h3>
  <div class="variant-grid" id="variantGrid"></div>
</div>

 <a href="#" class="whatsapp-btn">Chat on WhatsApp</a>

</div>

<!-- ✅ Gallery -->
<div class="product-gallery">

 <div class="main-image">
<img id="productImage"> </div>

 <div class="thumbnail-list">
  <img src="https://images.unsplash.com/photo-1519710164239-da123dc03ef4">
  <img src="https://images.unsplash.com/photo-1505691723518-36a5ac3be353">
  <img src="https://images.unsplash.com/photo-1505691723518-36a5ac3be353">
 </div>

</div>

</div>

</div>
<script>

function parseCSV(text){
 const rows=text.trim().split("\n");
 const headers=rows[0].split(",").map(h=>h.replace(/"/g,"").trim());
 return rows.slice(1).map(row=>{
  const cols=row.split(",");
  let obj={};
  headers.forEach((h,i)=>{
   obj[h]=(cols[i]||"").replace(/"/g,"").trim();
  });
  return obj;
 });
}

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

const productsURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSsp818LHJ9i4fVzl2B63EHRr-wJwcANhC9ZSUGKQn3TqgAxOjQFe4NfLNKl-sQ7Ndi1sZEzOpesx2L/pub?gid=0&single=true&output=csv";fetch(productsURL)
  .then(res => res.text())
  .then(data => {

    const products = parseCSV(data);

    const product = products.find(p => p.ProductID == productId)
    if(!product){
  document.body.innerHTML="<h2 style='text-align:center;margin-top:100px'>Product Not Found</h2>";
  return;
}

document.getElementById("productName").innerText = product.Name;
document.getElementById("productPrice").innerText = "Loading...";
document.getElementById("productImage").src = product.Image;
document.getElementById("productDescription").innerText = product.Description;

document.getElementById("productSpecs").innerHTML = `
  <div class="spec-item"><b>Category:</b> ${product.Category}</div>
  <div class="spec-item"><b>Color:</b> ${product.Color}</div>
`;
   console.log("Selected Product:", product);

});

</script>
</body>
</html>
